<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wallet</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

body {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh;
    color: #f1f5f9;
}

/* ===== NAVBAR ===== */
.navbar {
    height: 72px;
    background: #0f172a;
    border-bottom: 1px solid #334155;
    display: flex;
    align-items: center;
    padding: 0 32px;
}

.navbar .logo {
    font-size: 20px;
    font-weight: 700;
    color: #818cf8;
}

.navbar .nav-links {
    display: flex;
    gap: 28px;
    margin-left: 40px;
}

.navbar a {
    text-decoration: none;
    color: #94a3b8;
    font-weight: 500;
    transition: 0.3s;
}

.navbar a.active,
.navbar a:hover {
    color: #a5b4fc;
}

/* ===== PAGE ===== */
.page {
    width: 100%;
    padding: 32px;
}

/* ===== BALANCE CARD ===== */
.balance-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    margin-bottom: 28px;
}

.balance-title {
    color: #94a3b8;
    font-size: 16px;
}

.balance-amount {
    font-size: 42px;
    font-weight: 700;
    margin-top: 8px;
    color: #f1f5f9;
}

.balance-actions {
    margin-top: 24px;
    display: flex;
    gap: 16px;
}

.btn {
    border: none;
    padding: 14px 22px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

.btn-deposit {
    background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
    color: white;
}

.btn-deposit:hover {
    box-shadow: 0 15px 30px rgba(129,140,248,0.35);
    transform: translateY(-1px);
}

.btn-withdraw {
    background: #334155;
    color: #f1f5f9;
}

.btn-withdraw:hover {
    background: #3c4a5f;
}

/* ===== ASSETS ===== */
.assets-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    overflow: hidden;
}

.assets-header {
    padding: 22px 24px;
    border-bottom: 1px solid #334155;
    font-size: 18px;
    font-weight: 600;
}

.assets-table {
    width: 100%;
    border-collapse: collapse;
}

.assets-table th,
.assets-table td {
    padding: 18px 24px;
    text-align: left;
}

.assets-table thead {
    background: #0f172a;
}

.assets-table th {
    color: #94a3b8;
    font-weight: 500;
    font-size: 14px;
}

.assets-table tbody tr {
    border-top: 1px solid #334155;
}

.assets-table tbody tr:hover {
    background: rgba(129,140,248,0.05);
}

.asset-name {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 600;
}

.asset-badge {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(129,140,248,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #818cf8;
}

.stat {
    font-weight: 600;
}

.stat.available {
    color: #10b981;
}

.stat.frozen {
    color: #ef4444;
}

.stat.total {
    color: #f1f5f9;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .page {
        padding: 20px;
    }
    .balance-amount {
        font-size: 34px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">Exchange</div>
    <div class="nav-links">
        <a href="#">Spot</a>
        <a href="#">Futures</a>
        <a href="#" class="active">Wallet</a>
    </div>
</div>

<!-- PAGE -->
<div class="page">

    <!-- BALANCE -->
    <div class="balance-card">
        <div class="balance-title">Total Balance</div>
        <div class="balance-amount">$1,488.00</div>

        <div class="balance-actions">
            <button class="btn btn-deposit">Deposit</button>
            <button class="btn btn-withdraw">Withdraw</button>
        </div>
    </div>

    <!-- ASSETS -->
    <div class="assets-card">
        <div class="assets-header">Assets</div>

        <table class="assets-table">
            <thead>
                <tr>
                    <th>Asset</th>
                    <th>Available</th>
                    <th>Frozen</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="asset-name">
                        <div class="asset-badge">₮</div>
                        USDT (Tether)
                    </td>
                    <td class="stat available">2912.25</td>
                    <td class="stat frozen">0.00</td>
                    <td class="stat total">2912.25</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
// здесь потом можно подключить API и динамику
</script>

</body>
</html>

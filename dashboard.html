<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wallet</title>

<style>
:root {
  --bg-main: #0f172a;
  --bg-card: #1e293b;
  --bg-soft: #334155;
  --border: #334155;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --accent: #818cf8;
  --accent-soft: rgba(129,140,248,.15);
  --green: #10b981;
  --red: #ef4444;
}

/* RESET */
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
body {
  margin: 0;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: var(--text-main);
}

/* NAVBAR */
.navbar {
  display: flex;
  align-items: center;
  padding: 18px 32px;
  border-bottom: 1px solid var(--border);
}
.nav-left {
  display: flex;
  gap: 28px;
}
.nav-item {
  color: var(--text-muted);
  font-weight: 600;
  cursor: pointer;
}
.nav-item.active {
  color: var(--accent);
}
.nav-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 18px;
}
.profile {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-main);
}

/* PAGE */
.page {
  padding: 32px;
}

/* HEADER */
.wallet-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.balance {
  font-size: 26px;
  font-weight: 700;
}
.search {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  padding: 12px 16px;
  border-radius: 12px;
  color: var(--text-main);
  width: 260px;
}
.search::placeholder {
  color: var(--text-muted);
}

/* TABLE */
.table {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
}
.table-header,
.row {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr 1.2fr;
  align-items: center;
}
.table-header {
  padding: 16px 20px;
  background: #0f172a;
  color: var(--text-muted);
  font-weight: 600;
}
.row {
  padding: 18px 20px;
  border-top: 1px solid var(--border);
}
.asset {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 600;
}
.coin {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}
.amount {
  font-variant-numeric: tabular-nums;
}
.actions {
  display: flex;
  gap: 10px;
}
.btn {
  padding: 8px 14px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}
.deposit {
  background: rgba(16,185,129,.15);
  color: var(--green);
}
.withdraw {
  background: rgba(239,68,68,.15);
  color: var(--red);
}

/* HOVER */
.row:hover {
  background: rgba(129,140,248,.05);
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-left">
    <div class="nav-item">Spot</div>
    <div class="nav-item">Futures</div>
    <div class="nav-item">Earn</div>
    <div class="nav-item">Petra</div>
  </div>
  <div class="nav-right">
    <div class="nav-item active">Wallet</div>
    <div class="profile">👤</div>
  </div>
</div>

<!-- PAGE -->
<div class="page">

  <div class="wallet-header">
    <div class="balance">Balance: $1488</div>
    <input class="search" placeholder="Search asset..." oninput="filterAssets(this.value)">
  </div>

  <div class="table">
    <div class="table-header">
      <div>Asset</div>
      <div>Available</div>
      <div>Frozen</div>
      <div>Total</div>
      <div>Actions</div>
    </div>

    <div class="row asset-row">
      <div class="asset">
        <div class="coin">₮</div> USDT
      </div>
      <div class="amount">2912.25</div>
      <div class="amount">0.00</div>
      <div class="amount">2912.25</div>
      <div class="actions">
        <button class="btn deposit">Deposit</button>
        <button class="btn withdraw">Withdraw</button>
      </div>
    </div>

    <div class="row asset-row">
      <div class="asset">
        <div class="coin">₿</div> BTC
      </div>
      <div class="amount">0.124</div>
      <div class="amount">0.01</div>
      <div class="amount">0.134</div>
      <div class="actions">
        <button class="btn deposit">Deposit</button>
        <button class="btn withdraw">Withdraw</button>
      </div>
    </div>

    <div class="row asset-row">
      <div class="asset">
        <div class="coin">Ξ</div> ETH
      </div>
      <div class="amount">3.42</div>
      <div class="amount">0.00</div>
      <div class="amount">3.42</div>
      <div class="actions">
        <button class="btn deposit">Deposit</button>
        <button class="btn withdraw">Withdraw</button>
      </div>
    </div>

  </div>
</div>

<script>
function filterAssets(value) {
  value = value.toLowerCase();
  document.querySelectorAll('.asset-row').forEach(row => {
    row.style.display = row.innerText.toLowerCase().includes(value)
      ? 'grid'
      : 'none';
  });
}
</script>

</body>
</html>
